name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy src tests scripts
      - run: uv run --locked pytest --cov

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: openstack-mcp-server:ci
      - name: Image runs as an unprivileged user
        run: test "$(docker run --rm --entrypoint id openstack-mcp-server:ci -u)" != "0"
      - name: Stdio smoke test with environment-only configuration
        env:
          OPENSTACK_MCP_CACERT_PEM: |
            -----BEGIN CERTIFICATE-----
            AAAA
            -----END CERTIFICATE-----
        run: |
          set -- -e OS_AUTH_URL=https://keystone.example/v3 -e OS_USERNAME=smoke \
            -e OS_PASSWORD=synthetic -e OS_USER_DOMAIN_ID=default \
            -e OS_PROJECT_ID=00000000000000000000000000000000 \
            -e OPENSTACK_MCP_ENABLE_PROMPTS=false -e OPENSTACK_MCP_ENABLE_RESOURCES=false
          python3 scripts/smoke_stdio.py docker run --rm -i --read-only "$@" openstack-mcp-server:ci
          python3 scripts/smoke_stdio.py docker run --rm -i --read-only "$@" \
            -e OPENSTACK_MCP_CACERT_PEM openstack-mcp-server:ci
