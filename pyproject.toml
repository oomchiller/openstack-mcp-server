[project]
name = "openstack-mcp-server"
version = "0.1.0"
description = "Read-only-first MCP server for OpenStack clouds"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.27,<2",
    "openstacksdk>=4.6,<5",
    "keystoneauth1>=5.11,<6",
    "pydantic>=2.11,<3",
]

[project.scripts]
openstack-mcp-server = "openstack_mcp_server.__main__:main"

[project.urls]
Source = "https://github.com/oomchiller/openstack-mcp-server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.14,<1",
    "mypy>=1.18,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=6,<8",
]

[tool.uv]
# Resolve only releases at least two weeks old; move the date when upgrading.
exclude-newer = "2026-10-16T00:00:00Z"

[tool.hatch.build.targets.wheel]
packages = ["src/openstack_mcp_server"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S104", "S105", "S106", "S108", "S310", "S603"]
"scripts/*" = ["S101", "S603"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["openstack", "openstack.*", "keystoneauth1", "keystoneauth1.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
source = ["openstack_mcp_server"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
